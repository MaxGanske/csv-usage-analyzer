# DigitalOcean App Platform deployment template.
name: csv-usage-analyzer
region: nyc
services:
  - name: api
    environment_slug: python
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
    envs:
      - key: APP_NAME
        scope: RUN_TIME
        value: CSV Usage Analyzer
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ""
